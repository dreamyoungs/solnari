name: Bug report
description: Report reproducible incorrect behavior without including private data.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, project IDs, hostnames, database
        names, production SQL, schema details, query results, and customer data before submitting.
        Security vulnerabilities belong in a private security advisory.

  - type: input
    id: version
    attributes:
      label: Solnari version or commit
      placeholder: "0.1.0 or 58d29f6"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS and Mac
      placeholder: "macOS 15.6, Apple silicon"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - PostgreSQL
        - MySQL
        - SQLite
        - Not database-specific
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection path
      options:
        - Direct
        - Cloud SQL
        - SSH tunnel
        - Kubernetes existing resource
        - Kubernetes temporary relay
        - Local SQLite file
        - Not connection-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a disposable or sanitized example.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context
      description: Attach screenshots only after removing private infrastructure and data.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private infrastructure identifiers, SQL, schema, and result data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
